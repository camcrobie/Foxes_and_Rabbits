<style>
  html, body {
  margin: 0;

}

}

<script>
"use strict";

// ============================================================
// CONFIGURATION
// ============================================================

const GRID_SIZE = 8;
const MACRO_SIZE = 2;
const CELL_SIZE = 70;

const BOARD_W = GRID_SIZE * CELL_SIZE;

const WINDOW_PAD = 10;
const BOARD_BORDER = 20;

const PANEL_W = 620;

const CONTENT_H = BOARD_W + 2 * BOARD_BORDER;

const CONTENT_X0 = WINDOW_PAD;
const CONTENT_Y0 = WINDOW_PAD;

const BOARD_PANEL_GAP = 12;
const PANEL_X = CONTENT_X0 + (BOARD_W + 2 * BOARD_BORDER) + BOARD_PANEL_GAP;
const PANEL_Y = CONTENT_Y0;

const EXTRA_UI_H = 190;

const CONTENT_W = (BOARD_W + 2 * BOARD_BORDER) + BOARD_PANEL_GAP + PANEL_W;
const WIN_W = CONTENT_W + 2 * WINDOW_PAD;
const WIN_H = (CONTENT_H + EXTRA_UI_H) + 2 * WINDOW_PAD;

const BOARD_FRAME_X = CONTENT_X0;
const BOARD_FRAME_Y = CONTENT_Y0;

const BOARD_X0 = BOARD_FRAME_X + BOARD_BORDER;
const BOARD_Y0 = BOARD_FRAME_Y + BOARD_BORDER;

const PANEL_BG = "rgb(255,255,255)";

const PANEL_PAD = 24;
const GRAPH_LEFT_INSET = 40;
const GRAPH_GAP_V = 50;

const GRAPH_TOP_PADDING_FRAC = 0.4;
const GRAPH_BOTTOM_PADDING_FRAC = 0.10;

const TITLE_H = 30;

const GRAPH_AREA_X = PANEL_X + PANEL_PAD + GRAPH_LEFT_INSET;
const GRAPH_AREA_Y = PANEL_Y + PANEL_PAD;
const GRAPH_AREA_W = PANEL_W - 2 * PANEL_PAD - GRAPH_LEFT_INSET;
const GRAPH_AREA_H = CONTENT_H - 2 * PANEL_PAD;

const GRAPH_BLOCK_H = Math.floor((GRAPH_AREA_H - GRAPH_GAP_V) / 2);
const GRAPH_W = GRAPH_AREA_W;
const GRAPH_H = GRAPH_BLOCK_H - TITLE_H;

const GRAPH_X = GRAPH_AREA_X;
const GRAPH_Y = GRAPH_AREA_Y + TITLE_H;

const GRAPH2_X = GRAPH_AREA_X;
const GRAPH2_Y = GRAPH_AREA_Y + GRAPH_BLOCK_H + GRAPH_GAP_V + TITLE_H;
const GRAPH2_W = GRAPH_W;
const GRAPH2_H = GRAPH_H;

const STATE_TEXT_X = BOARD_FRAME_X;
const STATE_TEXT_Y = BOARD_FRAME_Y + CONTENT_H + 18;

const STATE_BOX_MAX_LINES = 4;

const ICON_SIZE = { w: 40, h: 40 };
const COUNTER_RADIUS = 7;

const START_RABBITS = 20;
const START_FOXES = 10;
const MAX_POPULATION = 400;

const RABBIT_BOOST_TARGET = 50;
const RABBIT_EXTRA_LAM_MAX = 1.5;
const RABBIT_BOOST_POWER = 3.0;
const MAX_BABIES_PER_RABBIT = 5;

const HISTORY_LEN = 60;

const AUTO_STEPS_PER_SEC = 6.0;

const THROW_ANIM_SECONDS = 0.6;
const FIRST_THROW_ANIM_SECONDS = 1.2;

// ============================================================
// COLOURS
// ============================================================

const WHITE = "rgb(245,245,245)";
const GREY = "rgb(170,170,170)";
const BLACK = "rgb(20,20,20)";
const GRID_LINE = "rgb(50,50,50)";

const WOOD = "rgb(130,85,40)";
const WOOD_DARK = "rgb(95,60,25)";

const PANEL_WOOD = "rgb(165,115,70)";
const PANEL_WOOD_DARK = "rgb(125,85,50)";
const PANEL_BORDER_W = 2;
const PANEL_CORNER_R = 10;
const PANEL_FRAME_PAD = 0;

const BACKGROUND = "rgb(30,30,30)";
const TEXT_COLOUR = "rgb(220,220,220)";

const BTN_BG = "rgb(60,60,60)";
const BTN_BG_HOVER = "rgb(80,80,80)";
const BTN_BORDER = "rgb(140,140,140)";

const AXIS_COL = "rgb(0,0,0)";

const PREDATION_LINE_COL = "rgb(170,20,20)";
const PREDATION_LINE_W = 5;

const STATE_BOX_PAD = 10;
const STATE_BOX_RADIUS = 6;
const STATE_BOX_BORDER_COL = "rgb(120,120,120)";
const STATE_BOX_BG = "rgb(255,255,255)";

// ============================================================
// SMALL HELPERS
// ============================================================

function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
function smoothstep(t) {
  t = clamp01(t);
  return t * t * t * (t * (t * 6 - 15) + 10);
}
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }

function randUniform(a, b) { return a + Math.random() * (b - a); }

function randomShuffle(arr) {
  // Fisher-Yates shuffle, in place (matches random.shuffle)
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function randomSample(arr, k) {
  // Return k unique items from arr (matches random.sample)
  const copy = arr.slice();
  randomShuffle(copy);
  return copy.slice(0, k);
}

function poissonSample(lam) {
  if (lam <= 0) return 0;
  const L = Math.exp(-lam);
  let k = 0;
  let p = 1.0;
  while (p > L) {
    k += 1;
    p *= Math.random();
  }
  return k - 1;
}

function overpopDeathProb(n, target) {
  target = target == null ? 100 : target;
  if (n <= 1) return 0.0;
  if (n <= target) return 0.5 * (n - 1) / (target - 1);
  const p = 0.5 + 0.5 * (n - target) / target;
  return clamp(p, 0.0, 0.95);
}

// Bounded queue (mirrors collections.deque(maxlen=...))
class Deque {
  constructor(maxlen) {
    this.items = [];
    this.maxlen = maxlen;
  }
  push(v) {
    this.items.push(v);
    while (this.items.length > this.maxlen) this.items.shift();
  }
  get length() { return this.items.length; }
  toArray() { return this.items.slice(); }
}

// Simple rectangle helper (mirrors pygame.Rect basics)
class Rect {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
  }
  collidepoint(px, py) {
    return px >= this.x && px <= this.x + this.w &&
           py >= this.y && py <= this.y + this.h;
  }
  get centerX() { return this.x + this.w / 2; }
  get centerY() { return this.y + this.h / 2; }
  get bottom() { return this.y + this.h; }
}

// ============================================================
// CANVAS DRAW PRIMITIVES
// ============================================================

function roundRectPath(ctx, x, y, w, h, r) {
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fillRect(ctx, x, y, w, h, color, radius) {
  ctx.fillStyle = color;
  if (radius && radius > 0) {
    roundRectPath(ctx, x, y, w, h, radius);
    ctx.fill();
  } else {
    ctx.fillRect(x, y, w, h);
  }
}

function strokeRect(ctx, x, y, w, h, color, width, radius) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  if (radius && radius > 0) {
    roundRectPath(ctx, x, y, w, h, radius);
    ctx.stroke();
  } else {
    ctx.strokeRect(x, y, w, h);
  }
}

function drawLine(ctx, x1, y1, x2, y2, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "butt";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function fillCircle(ctx, x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawText(ctx, text, x, y, color, font, baseline, align) {
  ctx.fillStyle = color;
  ctx.font = font;
  ctx.textBaseline = baseline || "top";
  ctx.textAlign = align || "left";
  ctx.fillText(text, x, y);
}

function measureTextWidth(ctx, text, font) {
  ctx.font = font;
  return ctx.measureText(text).width;
}

// Draw text rotated 90° counter-clockwise (mirrors pygame.transform.rotate(text, 90))
// Centered on (cx, cy) of the rotated text.
function drawTextRotated90(ctx, text, cx, cy, color, font) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = font;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.translate(cx, cy);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

// ============================================================
// BOARD TILES
// ============================================================

const BOARD_TILES = (() => {
  const t = [];
  for (let y = 0; y < GRID_SIZE; y++) {
    const row = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      if (x % 2 === 0 && y % 2 === 0) row.push(2);
      else if (x % 2 === 1 && y % 2 === 1) row.push(1);
      else row.push(0);
    }
    t.push(row);
  }
  return t;
})();

function tileAtPixel(px, py) {
  const cx = Math.max(0, Math.min(GRID_SIZE - 1, Math.floor(px / CELL_SIZE)));
  const cy = Math.max(0, Math.min(GRID_SIZE - 1, Math.floor(py / CELL_SIZE)));
  return { tile: BOARD_TILES[cy][cx], cx, cy };
}

function macroIndex(px, py) {
  let mx = Math.floor(px / (MACRO_SIZE * CELL_SIZE));
  let my = Math.floor(py / (MACRO_SIZE * CELL_SIZE));
  const lim = Math.floor(GRID_SIZE / MACRO_SIZE) - 1;
  mx = Math.max(0, Math.min(lim, mx));
  my = Math.max(0, Math.min(lim, my));
  return mx + "," + my; // string key for Map/Object lookup
}

// ============================================================
// PLACEMENT
// ============================================================

const MAX_PLACEMENT_TRIES = 2000;

function circlesOverlap(a, b, radius) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return (dx * dx + dy * dy) < (2 * radius) * (2 * radius);
}

function inBoundsWithMargin(p, margin) {
  return (margin <= p.x && p.x <= BOARD_W - margin) &&
         (margin <= p.y && p.y <= BOARD_W - margin);
}

function placeRandomNonoverlapping(count, existing, radius) {
  const placed = [];
  const edgeMargin = 2 * radius;

  const lo = Math.min(edgeMargin, BOARD_W / 2);
  const hi = Math.max(BOARD_W - lo, BOARD_W / 2);

  for (let i = 0; i < count; i++) {
    let placedOne = false;
    for (let t = 0; t < MAX_PLACEMENT_TRIES; t++) {
      const candidate = { x: randUniform(lo, hi), y: randUniform(lo, hi), r: radius };
      let ok = true;
      for (const c of existing) {
        if (circlesOverlap(candidate, c, radius)) { ok = false; break; }
      }
      if (ok) {
        for (const c of placed) {
          if (circlesOverlap(candidate, c, radius)) { ok = false; break; }
        }
      }
      if (ok) {
        placed.push(candidate);
        placedOne = true;
        break;
      }
    }
    if (!placedOne) {
      placed.push({ x: randUniform(lo, hi), y: randUniform(lo, hi), r: radius });
    }
  }
  return placed;
}

function placeAdjacentClosest(base, existing, radius) {
  const bx = base.x, by = base.y;
  const edgeMargin = 2 * radius;

  const minDist = 2 * radius;
  const maxDist = 6 * radius;
  const rings = 14;
  const anglesPerRing = 24;

  for (let i = 0; i < rings; i++) {
    const dist = minDist + i * (maxDist - minDist) / Math.max(1, rings - 1);
    for (let a = 0; a < anglesPerRing; a++) {
      const ang = randUniform(0, 2 * Math.PI);
      const x = bx + dist * Math.cos(ang);
      const y = by + dist * Math.sin(ang);

      const candidate = { x, y, r: radius };
      if (!inBoundsWithMargin(candidate, edgeMargin)) continue;

      let ok = true;
      for (const c of existing) {
        if (circlesOverlap(candidate, c, radius)) { ok = false; break; }
      }
      if (ok) return candidate;
    }
  }
  return placeRandomNonoverlapping(1, existing, radius)[0];
}

function capPopulation(rabbitN, foxN) {
  rabbitN = Math.max(0, Math.floor(rabbitN));
  foxN = Math.max(0, Math.floor(foxN));
  const total = rabbitN + foxN;
  if (total <= MAX_POPULATION) return [rabbitN, foxN];
  const scale = MAX_POPULATION / total;
  return [Math.floor(rabbitN * scale), Math.floor(foxN * scale)];
}

// ============================================================
// THROW POSITION GENERATION + ANIMATION
// ============================================================

function generateThrowPositions(foxN, rabbitN) {
  const foxesRaw = placeRandomNonoverlapping(foxN, [], COUNTER_RADIUS);
  const foxes = foxesRaw.map(f => Object.assign({}, f, { kind: "fox", flag: "normal" }));

  const rabbitsRaw = placeRandomNonoverlapping(rabbitN, foxes, COUNTER_RADIUS);
  const rabbits = rabbitsRaw.map(r => Object.assign({}, r, { kind: "rabbit", flag: "normal" }));

  return { foxes, rabbits };
}

function startThrowAnimation(state, newFoxes, newRabbits, fromCenter) {
  state.predation_links = [];
  state.eaten_rabbits_display = [];
  state.last_step = null;
  state.pending_display_counts = null;
  state.dead_rabbits = [];
  state.animating_throw = true;
  state.anim_t = 0.0;

  let baseDur = fromCenter ? FIRST_THROW_ANIM_SECONDS : THROW_ANIM_SECONDS;
  if (state.autoplay) baseDur *= 0.5;
  state.anim_dur = baseDur;

  const cx = BOARD_W / 2.0;
  const cy = BOARD_W / 2.0;

  if (fromCenter || (state.foxes.length === 0 && state.rabbits.length === 0)) {
    state.anim_from_foxes = newFoxes.map(() => ({ x: cx, y: cy }));
    state.anim_from_rabbits = newRabbits.map(() => ({ x: cx, y: cy }));
  } else {
    state.anim_from_foxes = state.foxes.map(f => ({ x: f.x, y: f.y }));
    state.anim_from_rabbits = state.rabbits.map(r => ({ x: r.x, y: r.y }));
  }

  state.anim_to_foxes = newFoxes;
  state.anim_to_rabbits = newRabbits;

  state.work_foxes = newFoxes;
  state.work_rabbits = newRabbits;
  state.dead_foxes = [];
  state.newborn_rabbits = [];
  state.new_foxes = [];
  state.phase = 0;

  state.foxes_display_n = newFoxes.length;
  state.rabbits_display_n = newRabbits.length;
}

function updateThrowAnimation(state, dt) {
  if (!state.animating_throw) return;

  const alpha = 0.15;
  state.anim_dt_smooth = (1 - alpha) * (state.anim_dt_smooth || dt) + alpha * dt;
  const dtUse = state.anim_dt_smooth;

  state.anim_t += dtUse;

  if (state.anim_t >= state.anim_dur) {
    state.animating_throw = false;
    state.foxes = state.work_foxes;
    state.rabbits = state.work_rabbits;
  }
}

// ============================================================
// SIMULATION PHASES
// ============================================================

function stepDeaths(state) {
  state.predation_links = [];
  state.eaten_rabbits_display = [];
  state.last_step = "deaths";
  state.pending_display_counts = null;
  state.dead_rabbits = [];

  const dead = [];
  let alive = [];
  for (const f of state.work_foxes) {
    const t = tileAtPixel(f.x, f.y).tile;
    if (t === 2) {
      const f2 = Object.assign({}, f, { flag: "dead" });
      dead.push(f2);
    } else {
      alive.push(f);
    }
  }

  if (state.overpop_control) {
    const pFox = overpopDeathProb(alive.length, 150);
    const alive2 = [];
    for (const f of alive) {
      if (Math.random() < pFox) {
        dead.push(Object.assign({}, f, { flag: "dead" }));
      } else {
        alive2.push(f);
      }
    }
    alive = alive2;

    const rabbits = state.work_rabbits;
    const pRab = overpopDeathProb(rabbits.length, 150);

    const rabbitsAlive2 = [];
    const deadRabbits = [];
    for (const r of rabbits) {
      if (Math.random() < pRab) {
        const r2 = Object.assign({}, r, { flag: "dead_rabbit" });
        r2.dead_baby = (r.flag === "newborn");
        deadRabbits.push(r2);
      } else {
        rabbitsAlive2.push(r);
      }
    }

    state.work_rabbits = rabbitsAlive2;
    state.dead_rabbits = deadRabbits;
  }

  state.dead_foxes = dead;
  state.work_foxes = alive;
  state.foxes_display_n = state.work_foxes.length;
  state.rabbits_display_n = state.work_rabbits.length;
}

function stepBirths(state) {
  state.predation_links = [];
  state.eaten_rabbits_display = [];
  state.last_step = "births";
  state.pending_display_counts = null;

  const rabbits = state.work_rabbits;
  const newborns = [];

  let lamExtra = 0.0;
  if (state.rabbit_rescue_births) {
    const nRabbits = rabbits.length;
    let frac = (RABBIT_BOOST_TARGET - nRabbits) / Math.max(1, RABBIT_BOOST_TARGET);
    frac = Math.max(0.0, Math.min(1.0, frac));
    lamExtra = RABBIT_EXTRA_LAM_MAX * Math.pow(frac, RABBIT_BOOST_POWER);
  }

  for (const r of rabbits) {
    const t = tileAtPixel(r.x, r.y).tile;
    if (t === 0) {
      let babies;
      if (state.rabbit_rescue_births) {
        const extra = poissonSample(lamExtra);
        babies = 1 + extra;
        if (babies > MAX_BABIES_PER_RABBIT) babies = MAX_BABIES_PER_RABBIT;
      } else {
        babies = 1;
      }

      for (let b = 0; b < babies; b++) {
        const existing = state.work_rabbits.concat(state.work_foxes, newborns);
        const nr = placeAdjacentClosest(r, existing, COUNTER_RADIUS);
        nr.kind = "rabbit";
        nr.flag = "newborn";
        newborns.push(nr);
      }
    }
  }

  state.newborn_rabbits = newborns;
  state.work_rabbits = rabbits.concat(newborns);
  state.foxes_display_n = state.work_foxes.length;
  state.rabbits_display_n = state.work_rabbits.length;
}

function stepPredation(state) {
  const foxes = state.work_foxes;
  const rabbits = state.work_rabbits;

  const rabbitsByMacro = new Map();
  const foxesByMacro = new Map();

  for (const r of rabbits) {
    const k = macroIndex(r.x, r.y);
    if (!rabbitsByMacro.has(k)) rabbitsByMacro.set(k, []);
    rabbitsByMacro.get(k).push(r);
  }
  for (const f of foxes) {
    const k = macroIndex(f.x, f.y);
    if (!foxesByMacro.has(k)) foxesByMacro.set(k, []);
    foxesByMacro.get(k).push(f);
  }

  const eatenRabbits = new Set(); // refs
  const newFoxes = [];
  const links = [];
  let victimsForDisplay = [];
  const atePredators = new Set(); // refs

  for (const [key, rlist] of rabbitsByMacro.entries()) {
    const flist = foxesByMacro.get(key) || [];
    const k = Math.min(rlist.length, flist.length);
    if (k <= 0) continue;

    const victims = randomSample(rlist, k);
    const predators = flist.slice();
    randomShuffle(predators);
    const predSel = predators.slice(0, k);

    for (let i = 0; i < k; i++) {
      const predator = predSel[i];
      const victim = victims[i];

      eatenRabbits.add(victim);
      atePredators.add(predator);

      const vdisp = Object.assign({}, victim);
      vdisp._victim_ref = victim; // for filtering later
      vdisp.flag = "dead_rabbit";
      vdisp.dead_baby = (victim.flag === "newborn");

      victimsForDisplay.push(vdisp);

      links.push({
        from: { x: predator.x, y: predator.y },
        to: { x: victim.x, y: victim.y },
        ref: victim
      });

      const nf = {
        x: victim.x, y: victim.y, r: COUNTER_RADIUS,
        kind: "fox", flag: "new",
        from_ref: victim
      };
      newFoxes.push(nf);
    }
  }

  const rabbitsSurvivors = rabbits.filter(r => !eatenRabbits.has(r));

  let surviving_adult_foxes;
  if (state.hungry_foxes_die) {
    surviving_adult_foxes = foxes.filter(f => atePredators.has(f));
    const hungryDead = foxes.filter(f => !atePredators.has(f));
    state.dead_foxes = hungryDead.map(f => Object.assign({}, f, { flag: "dead" }));
  } else {
    surviving_adult_foxes = foxes;
    state.dead_foxes = [];
  }

  let foxesAfter = surviving_adult_foxes.concat(newFoxes);

  const [rn, fn] = capPopulation(rabbitsSurvivors.length, foxesAfter.length);

  let rabSurvivorsFinal = rabbitsSurvivors;
  if (rn < rabbitsSurvivors.length) {
    rabSurvivorsFinal = randomSample(rabbitsSurvivors, rn);
  }

  if (fn < foxesAfter.length) {
    const newPart = foxesAfter.filter(f => f.flag === "new");
    const oldPart = foxesAfter.filter(f => f.flag !== "new");

    if (newPart.length >= fn) {
      foxesAfter = randomSample(newPart, fn);
    } else {
      const keep = newPart.slice();
      const remain = fn - keep.length;
      if (remain > 0 && oldPart.length > 0) {
        const extra = randomSample(oldPart, Math.min(remain, oldPart.length));
        for (const f of extra) keep.push(f);
      }
      foxesAfter = keep;
    }
  }

  // Filter display lists to only kept conversions
  const keptFromRefs = new Set();
  for (const f of foxesAfter) {
    if (f.flag === "new" && f.from_ref) keptFromRefs.add(f.from_ref);
  }

  victimsForDisplay = victimsForDisplay.filter(v => keptFromRefs.has(v._victim_ref));
  const filteredLinks = links.filter(l => keptFromRefs.has(l.ref));

  state.work_rabbits = rabSurvivorsFinal;
  state.work_foxes = foxesAfter;
  state.new_foxes = foxesAfter.filter(f => f.flag === "new");

  state.predation_links = filteredLinks.map(l => [
    { x: l.from.x, y: l.from.y },
    { x: l.to.x, y: l.to.y }
  ]);
  state.eaten_rabbits_display = victimsForDisplay;
  state.last_step = "predation";

  state.pending_display_counts = [state.work_rabbits.length, state.work_foxes.length];
}

function commitPopulations(state) {
  state.rabbits_n = state.rabbits_display_n;
  state.foxes_n = state.foxes_display_n;
  state.pending_display_counts = null;

  state.rabbits = state.work_rabbits;
  state.foxes = state.work_foxes;

  state.dead_foxes = [];
  state.newborn_rabbits = [];
  state.new_foxes = [];
  state.dead_rabbits = [];
  state.predation_links = [];
  state.eaten_rabbits_display = [];
  state.last_step = "ready";

  if (state.rabbits_n === 0 || state.foxes_n === 0) {
    state.game_over = true;
  }

  if (state.game_over && !state.final_point_added) {
    state.rab_hist.push(state.rabbits_n);
    state.fox_hist.push(state.foxes_n);
    state.throw_i += 1;
    state.throw_hist.push(state.throw_i);
    state.final_point_added = true;
  }

  state.phase = -1;
}

// ============================================================
// STATE MANAGEMENT
// ============================================================

function reset(opts) {
  opts = opts || {};
  const state = {
    rabbits_n: START_RABBITS,
    foxes_n: START_FOXES,
    rabbits: [],
    foxes: [],
    rab_hist: new Deque(HISTORY_LEN),
    fox_hist: new Deque(HISTORY_LEN),
    game_over: false,
    final_point_added: false,
    dead_rabbits: [],
    throw_i: 0,
    throw_hist: new Deque(HISTORY_LEN),

    pending_display_counts: null,
    anim_dt_smooth: 1 / 60,

    phase: -1,
    work_rabbits: [],
    work_foxes: [],
    dead_foxes: [],
    newborn_rabbits: [],
    new_foxes: [],

    first_throw_prompt: true,

    rabbits_display_n: START_RABBITS,
    foxes_display_n: START_FOXES,

    hungry_foxes_die: !!opts.hungry_foxes_die,
    eat_before_reproduce: !!opts.eat_before_reproduce,
    overpop_control: !!opts.overpop_control,
    rabbit_rescue_births: !!opts.rabbit_rescue_births,

    autoplay: false,
    autoplay_accum: 0.0,

    animating_throw: false,
    anim_t: 0.0,
    anim_dur: 0.0,
    anim_from_foxes: [],
    anim_from_rabbits: [],
    anim_to_foxes: [],
    anim_to_rabbits: [],

    predation_links: [],
    eaten_rabbits_display: [],
    last_step: null
  };

  state.rab_hist.push(state.rabbits_n);
  state.fox_hist.push(state.foxes_n);
  state.throw_hist.push(state.throw_i);

  const { foxes, rabbits } = generateThrowPositions(state.foxes_n, state.rabbits_n);
  startThrowAnimation(state, foxes, rabbits, true);

  return state;
}

// ============================================================
// GRAPH DRAWING HELPERS
// ============================================================

function drawDashedPolyline(ctx, points, color, width, dashLen, gapLen) {
  width = width || 2;
  dashLen = dashLen || 10;
  gapLen = gapLen || 8;
  if (points.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  for (let i = 0; i < points.length - 1; i++) {
    const [x1, y1] = points[i];
    const [x2, y2] = points[i + 1];
    const dx = x2 - x1;
    const dy = y2 - y1;
    const segLen = Math.hypot(dx, dy);
    if (segLen <= 0.001) continue;
    const ux = dx / segLen;
    const uy = dy / segLen;
    let dist = 0.0;
    while (dist < segLen) {
      const start = dist;
      const end = Math.min(dist + dashLen, segLen);
      const sx = x1 + ux * start;
      const sy = y1 + uy * start;
      const ex = x1 + ux * end;
      const ey = y1 + uy * end;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      dist += dashLen + gapLen;
    }
  }
}

function drawDottedPolyline(ctx, points, color, dotRadius, spacing) {
  dotRadius = dotRadius || 2;
  spacing = spacing || 10;
  if (points.length < 2) return;
  ctx.fillStyle = color;
  let carry = 0.0;
  for (let i = 0; i < points.length - 1; i++) {
    const [x1, y1] = points[i];
    const [x2, y2] = points[i + 1];
    const dx = x2 - x1;
    const dy = y2 - y1;
    const segLen = Math.hypot(dx, dy);
    if (segLen <= 0.001) continue;
    const ux = dx / segLen;
    const uy = dy / segLen;
    let dist = Math.max(0, spacing - carry);
    while (dist <= segLen) {
      const px = x1 + ux * dist;
      const py = y1 + uy * dist;
      ctx.beginPath();
      ctx.arc(px, py, dotRadius, 0, Math.PI * 2);
      ctx.fill();
      dist += spacing;
    }
    carry = (carry + segLen) % spacing;
  }
}

function drawArrow(ctx, color, start, end, width, headLen, headAngDeg) {
  width = width || 2;
  headLen = headLen || 10;
  headAngDeg = headAngDeg || 28;

  const x1 = start[0], y1 = start[1];
  const x2 = end[0], y2 = end[1];

  drawLine(ctx, x1, y1, x2, y2, color, width);

  const dx = x2 - x1;
  const dy = y2 - y1;
  const dist = Math.hypot(dx, dy);
  if (dist < 0.001) return;

  const ux = dx / dist;
  const uy = dy / dist;

  const ang = headAngDeg * Math.PI / 180;
  const ca = Math.cos(ang);
  const sa = Math.sin(ang);

  const bx = -ux, by = -uy;

  const lx = bx * ca - by * sa;
  const ly = bx * sa + by * ca;
  const rx = bx * ca + by * sa;
  const ry = -bx * sa + by * ca;

  const p1 = [x2, y2];
  const p2 = [x2 + lx * headLen, y2 + ly * headLen];
  const p3 = [x2 + rx * headLen, y2 + ry * headLen];

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(p1[0], p1[1]);
  ctx.lineTo(p2[0], p2[1]);
  ctx.lineTo(p3[0], p3[1]);
  ctx.closePath();
  ctx.fill();
}

const FONT = "20px Arial, sans-serif";
const FONT_LINE_HEIGHT = 22; // approximate match to pygame size 26 line height

function drawGraph(ctx, throwHist, rabHist, foxHist, gx, gy, gw, gh) {
  fillRect(ctx, gx, gy, gw, gh, "rgb(255,255,255)", 6);
  strokeRect(ctx, gx, gy, gw, gh, "rgb(120,120,120)", 1, 6);

  const xs = throwHist.toArray();
  const rabs = rabHist.toArray();
  const foxes = foxHist.toArray();

  const n = Math.min(xs.length, rabs.length, foxes.length);
  if (n === 0) return;

  const xsT = xs.slice(0, n);
  const rabsT = rabs.slice(0, n);
  const foxesT = foxes.slice(0, n);

  const minPop = 0;
  const maxPop = Math.max(Math.max.apply(null, rabsT), Math.max.apply(null, foxesT), 1);

  let span = maxPop - minPop;
  if (span === 0) span = 1;

  const yMin = Math.max(0, minPop - GRAPH_BOTTOM_PADDING_FRAC * span);
  const yMax = maxPop + GRAPH_TOP_PADDING_FRAC * span;

  const tickLen = 6;
  const yTicks = 5;
  for (let j = 0; j <= yTicks; j++) {
    const frac = j / yTicks;
    const v = yMin + (yMax - yMin) * (1 - frac);
    const y = gy + gh * frac;
    drawLine(ctx, gx, y, gx + tickLen, y, AXIS_COL, 1);

    const label = String(Math.round(v));
    const w = measureTextWidth(ctx, label, FONT);
    drawText(ctx, label, gx - w - 6, y - FONT_LINE_HEIGHT / 2, AXIS_COL, FONT, "top");
  }

  // Y title rotated 90°
  drawTextRotated90(ctx, "Population",
                    gx - 30 - 12, gy + gh / 2, AXIS_COL, FONT);

  // X title
  const xt = "Throws";
  const xtW = measureTextWidth(ctx, xt, FONT);
  drawText(ctx, xt, gx + (gw - xtW) / 2, gy + gh + 22, AXIS_COL, FONT, "top");

  if (n < 2) return;

  const xMin = xsT[0];
  const xMax = xsT[n - 1];
  let xSpan = xMax - xMin;
  if (xSpan === 0) xSpan = 1;

  function toScreen(xv, yv) {
    const px = gx + ((xv - xMin) / xSpan) * gw;
    const py = gy + gh * (1 - (yv - yMin) / (yMax - yMin));
    return [Math.round(px), Math.round(py)];
  }

  const xSpanIdx = n - 1;
  const xTicks = xSpanIdx > 0 ? Math.min(5, xSpanIdx) : 1;

  let lastLabel = null;
  for (let j = 0; j <= xTicks; j++) {
    const frac = xTicks > 0 ? j / xTicks : 0.0;
    let idx = Math.round(frac * xSpanIdx);
    idx = Math.max(0, Math.min(n - 1, idx));

    const labelVal = xsT[idx];
    if (labelVal === lastLabel) continue;
    lastLabel = labelVal;

    const x = gx + gw * frac;
    drawLine(ctx, x, gy + gh, x, gy + gh - tickLen, AXIS_COL, 1);

    const label = String(labelVal);
    const w = measureTextWidth(ctx, label, FONT);
    drawText(ctx, label, x - w / 2, gy + gh + 2, AXIS_COL, FONT, "top");
  }

  const foxPoints = [];
  const rabPoints = [];
  for (let i = 0; i < n; i++) {
    foxPoints.push(toScreen(xsT[i], foxesT[i]));
    rabPoints.push(toScreen(xsT[i], rabsT[i]));
  }

  drawDashedPolyline(ctx, foxPoints, AXIS_COL, 2, 10, 8);
  drawDottedPolyline(ctx, rabPoints, AXIS_COL, 2, 10);
}

function drawPhaseGraph(ctx, rabHist, foxHist) {
  fillRect(ctx, GRAPH2_X, GRAPH2_Y, GRAPH2_W, GRAPH2_H, "rgb(255,255,255)", 6);
  strokeRect(ctx, GRAPH2_X, GRAPH2_Y, GRAPH2_W, GRAPH2_H, "rgb(120,120,120)", 1, 6);

  const rabs = rabHist.toArray();
  const foxes = foxHist.toArray();
  const n = Math.min(rabs.length, foxes.length);
  if (n === 0) return;

  const xs = rabs;
  const ys = foxes;

  const xMax = Math.max.apply(null, xs.concat([1]));
  const yMax = Math.max.apply(null, ys.concat([1]));

  const xSpan = Math.max(1, xMax);
  const ySpan = Math.max(1, yMax);

  const x0 = 0, y0 = 0;
  const x1 = xMax + 0.1 * xSpan;
  const y1 = yMax + 0.1 * ySpan;

  function toScreen(xv, yv) {
    const px = GRAPH2_X + (xv - x0) / (x1 - x0) * GRAPH2_W;
    const py = GRAPH2_Y + GRAPH2_H * (1 - (yv - y0) / (y1 - y0));
    return [Math.round(px), Math.round(py)];
  }

  const tickLen = 6;
  const yTicks = 5;
  for (let j = 0; j <= yTicks; j++) {
    const frac = j / yTicks;
    const v = y0 + (y1 - y0) * (1 - frac);
    const y = GRAPH2_Y + GRAPH2_H * frac;
    drawLine(ctx, GRAPH2_X, y, GRAPH2_X + tickLen, y, AXIS_COL, 1);
    const label = String(Math.round(v));
    const w = measureTextWidth(ctx, label, FONT);
    drawText(ctx, label, GRAPH2_X - w - 6, y - FONT_LINE_HEIGHT / 2, AXIS_COL, FONT, "top");
  }

  const xTicks = 5;
  for (let j = 0; j <= xTicks; j++) {
    const frac = j / xTicks;
    const v = x0 + (x1 - x0) * frac;
    const x = GRAPH2_X + GRAPH2_W * frac;
    drawLine(ctx, x, GRAPH2_Y + GRAPH2_H, x, GRAPH2_Y + GRAPH2_H - tickLen, AXIS_COL, 1);
    const label = String(Math.round(v));
    const w = measureTextWidth(ctx, label, FONT);
    drawText(ctx, label, x - w / 2, GRAPH2_Y + GRAPH2_H + 2, AXIS_COL, FONT, "top");
  }

  const xT = "Rabbits";
  const xTW = measureTextWidth(ctx, xT, FONT);
  drawText(ctx, xT, GRAPH2_X + (GRAPH2_W - xTW) / 2, GRAPH2_Y + GRAPH2_H + 22, AXIS_COL, FONT, "top");

  drawTextRotated90(ctx, "Foxes",
                    GRAPH2_X - 30 - 12, GRAPH2_Y + GRAPH2_H / 2, AXIS_COL, FONT);

  if (n >= 2) {
    const pts = [];
    for (let i = 0; i < n; i++) pts.push(toScreen(xs[i], ys[i]));
    for (let i = 0; i < pts.length - 1; i++) {
      drawArrow(ctx, AXIS_COL, pts[i], pts[i + 1], 2, 10);
    }
  }
}

function drawPredationLinks(ctx, state) {
  if (state.animating_throw) return;
  if (state.last_step !== "predation") return;
  for (const seg of state.predation_links) {
    const [from, to] = seg;
    drawLine(ctx,
             Math.round(BOARD_X0 + from.x), Math.round(BOARD_Y0 + from.y),
             Math.round(BOARD_X0 + to.x),   Math.round(BOARD_Y0 + to.y),
             PREDATION_LINE_COL, PREDATION_LINE_W);
  }
}

// ============================================================
// COUNTER DRAWING
// ============================================================

function drawIconCentered(ctx, icon, cx, cy) {
  if (icon && icon.image && icon.image.complete && icon.image.naturalWidth > 0) {
    ctx.drawImage(icon.image, cx - ICON_SIZE.w / 2, cy - ICON_SIZE.h / 2,
                  ICON_SIZE.w, ICON_SIZE.h);
  } else if (icon && icon.fallbackEmoji) {
    ctx.font = (ICON_SIZE.h - 6) + "px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgb(0,0,0)";
    ctx.fillText(icon.fallbackEmoji, cx, cy);
  }
}

function drawCounters(ctx, state, icons) {
  const {
    fox_icon, dead_fox_icon, baby_fox_icon,
    rabbit_icon, baby_rabbit_icon, dead_rabbit_icon, dead_baby_rabbit_icon
  } = icons;

  if (state.animating_throw) {
    const t = smoothstep(state.anim_t / Math.max(0.0001, state.anim_dur));

    const fromR = state.anim_from_rabbits;
    const toR = state.anim_to_rabbits;
    for (let i = 0; i < toR.length; i++) {
      const r = toR[i];
      const fx = fromR[i].x, fy = fromR[i].y;
      const x = lerp(fx, r.x, t);
      const y = lerp(fy, r.y, t);
      const icon = (r.flag === "newborn") ? baby_rabbit_icon : rabbit_icon;
      drawIconCentered(ctx, icon, BOARD_X0 + x, BOARD_Y0 + y);
    }

    const fromF = state.anim_from_foxes;
    const toF = state.anim_to_foxes;
    for (let i = 0; i < toF.length; i++) {
      const f = toF[i];
      const fx = fromF[i].x, fy = fromF[i].y;
      const x = lerp(fx, f.x, t);
      const y = lerp(fy, f.y, t);
      const icon = (f.flag === "new") ? baby_fox_icon : fox_icon;
      drawIconCentered(ctx, icon, BOARD_X0 + x, BOARD_Y0 + y);
    }
    return;
  }

  if (state.last_step === "predation") {
    const rabbitsToDraw = state.work_rabbits.concat(state.eaten_rabbits_display);
    for (const r of rabbitsToDraw) {
      let icon;
      if (r.flag === "dead_rabbit") {
        icon = r.dead_baby ? dead_baby_rabbit_icon : dead_rabbit_icon;
      } else {
        icon = (r.flag === "newborn") ? baby_rabbit_icon : rabbit_icon;
      }
      drawIconCentered(ctx, icon, BOARD_X0 + r.x, BOARD_Y0 + r.y);
    }

    for (const f of state.work_foxes) {
      if (f.flag === "new") continue;
      drawIconCentered(ctx, fox_icon, BOARD_X0 + f.x, BOARD_Y0 + f.y);
    }

    for (const f of state.dead_foxes) {
      drawIconCentered(ctx, dead_fox_icon, BOARD_X0 + f.x, BOARD_Y0 + f.y);
    }
    return;
  }

  for (const r of state.rabbits) {
    const icon = (r.flag === "newborn") ? baby_rabbit_icon : rabbit_icon;
    drawIconCentered(ctx, icon, BOARD_X0 + r.x, BOARD_Y0 + r.y);
  }

  for (const f of state.foxes) {
    const icon = (f.flag === "new") ? baby_fox_icon : fox_icon;
    drawIconCentered(ctx, icon, BOARD_X0 + f.x, BOARD_Y0 + f.y);
  }

  if (state.phase === 1) {
    for (const f of state.dead_foxes) {
      drawIconCentered(ctx, dead_fox_icon, BOARD_X0 + f.x, BOARD_Y0 + f.y);
    }
    for (const r of state.dead_rabbits) {
      const icon = r.dead_baby ? dead_baby_rabbit_icon : dead_rabbit_icon;
      drawIconCentered(ctx, icon, BOARD_X0 + r.x, BOARD_Y0 + r.y);
    }
  }
}

// ============================================================
// UI HELPERS
// ============================================================

function phaseLabel(state) {
  if (state.game_over) {
    return [
      "Extinction!",
      "Press 'R' to reset the board."
    ];
  }

  if (state.phase === 0) {
    if (state.first_throw_prompt) {
      return [
        "Foxes and rabbits are thrown randomly onto the board.",
        "Press 'SPACE' to advance each step, or click 'Autoplay' below."
      ];
    }
    return [
      "New throw, all positions are randomised.",
      "Baby foxes and rabbits have grown up."
    ];
  }

  if (state.phase === 1) {
    const lines = [
      "Foxes that landed on black squares die.",
      "Dead foxes will be removed."
    ];
    if (state.overpop_control) {
      lines.push("Foxes and rabbits also die randomly if they are overpopulated.");
      lines.push("Dead rabbits will also be removed.");
    }
    return lines;
  }

  if (state.phase === 2) {
    if (state.eat_before_reproduce) {
      const lines = [
        "Foxes select rabbits to eat within their thick-lined squares.",
        "Eaten rabbits will become baby foxes."
      ];
      if (state.hungry_foxes_die) {
        lines.push("Foxes that haven't eaten die and will be removed.");
      }
      return lines;
    } else {
      const lines = [
        "Rabbits that landed on white squares reproduce.",
        "Baby rabbits appear next to their parents."
      ];
      if (state.rabbit_rescue_births) {
        lines.push("Rabbits have extra babies if their population is low.");
      }
      return lines;
    }
  }

  if (state.phase === 3) {
    if (state.eat_before_reproduce) {
      const lines = [
        "Rabbits that landed on white squares reproduce.",
        "Baby rabbits appear next to their parents."
      ];
      if (state.rabbit_rescue_births) {
        lines.push("Rabbits have extra babies if their population is low.");
      }
      return lines;
    } else {
      const lines = [
        "Foxes select rabbits to eat within their thick-lined squares.",
        "Eaten rabbits will become baby foxes."
      ];
      if (state.hungry_foxes_die) {
        lines.push("Foxes that haven't eaten die and will be removed.");
      }
      return lines;
    }
  }

  if (state.phase === -1) {
    return [
      "Fox and rabbit populations have been updated.",
      "Ready to throw again."
    ];
  }

  return [];
}

function drawButton(ctx, rect, label, mouseLogical) {
  const hover = rect.collidepoint(mouseLogical.x, mouseLogical.y);
  const bg = hover ? BTN_BG_HOVER : BTN_BG;

  fillRect(ctx, rect.x, rect.y, rect.w, rect.h, bg, 6);
  strokeRect(ctx, rect.x, rect.y, rect.w, rect.h, BTN_BORDER, 1, 6);

  ctx.fillStyle = TEXT_COLOUR;
  ctx.font = FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, rect.centerX, rect.centerY);
}

// ============================================================
// STEP ADVANCEMENT
// ============================================================

function advanceOneStep(state) {
  if (state.animating_throw) return;
  if (state.game_over) return;

  if (state.pending_display_counts !== null) {
    const [rn, fn] = state.pending_display_counts;
    state.rabbits_display_n = rn;
    state.foxes_display_n = fn;
    state.pending_display_counts = null;
  }

  if (state.phase === -1) {
    state.throw_i += 1;
    state.throw_hist.push(state.throw_i);
    state.rab_hist.push(state.rabbits_n);
    state.fox_hist.push(state.foxes_n);

    state.first_throw_prompt = false;

    const { foxes, rabbits } = generateThrowPositions(state.foxes_n, state.rabbits_n);
    startThrowAnimation(state, foxes, rabbits, false);
  } else if (state.phase === 0) {
    state.first_throw_prompt = false;
    stepDeaths(state);
    state.rabbits = state.work_rabbits;
    state.foxes = state.work_foxes;
    state.phase = 1;
  } else if (state.phase === 1) {
    if (state.eat_before_reproduce) {
      stepPredation(state);
    } else {
      stepBirths(state);
    }
    state.rabbits = state.work_rabbits;
    state.foxes = state.work_foxes;
    state.phase = 2;
  } else if (state.phase === 2) {
    if (state.eat_before_reproduce) {
      stepBirths(state);
    } else {
      stepPredation(state);
    }
    state.rabbits = state.work_rabbits;
    state.foxes = state.work_foxes;
    state.phase = 3;
  } else if (state.phase === 3) {
    commitPopulations(state);
  }
}

function loadIcon(src, fallbackEmoji) {
  return new Promise((resolve) => {
    const img = new Image();
    const result = { image: img, fallbackEmoji };
    img.onload = () => resolve(result);
    img.onerror = () => { result.image = null; resolve(result); };
    img.src = src;
  });
}

// ============================================================
// MAIN
// ============================================================

async function main() {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const icons = await loadIcons();

  let state = reset({
    eat_before_reproduce: false,
    hungry_foxes_die: false,
    overpop_control: false,
    rabbit_rescue_births: false
  });

  // ----------------------------------------------------
  // Buttons (positions identical to the Python layout)
  // ----------------------------------------------------
  const btn_h = 30;
  const btn_gap = 8;

  const btn_w = Math.floor(GRAPH_W * 0.9);

	// Separate width for autoplay button
	const auto_btn_w = Math.floor(GRAPH_W * 0.65);
  const btn_x = GRAPH_X + Math.floor((GRAPH_W - btn_w) / 2);

  const buttons_y = (PANEL_Y + CONTENT_H) + 18;
  const RIGHT_BUTTON_Y_OFFSET = 15;

  const toggle_eat_rect     = new Rect(btn_x, buttons_y + RIGHT_BUTTON_Y_OFFSET + 0 * (btn_h + btn_gap), btn_w, btn_h);
  const toggle_hungry_rect  = new Rect(btn_x, buttons_y + RIGHT_BUTTON_Y_OFFSET + 1 * (btn_h + btn_gap), btn_w, btn_h);
  const toggle_overpop_rect = new Rect(btn_x, buttons_y + RIGHT_BUTTON_Y_OFFSET + 2 * (btn_h + btn_gap), btn_w, btn_h);
  const toggle_rescue_rect  = new Rect(btn_x, buttons_y + RIGHT_BUTTON_Y_OFFSET + 3 * (btn_h + btn_gap), btn_w, btn_h);

  // The autoplay button position is recomputed each frame (mirrors the Python code).
  let toggle_auto_rect = new Rect(btn_x, buttons_y + 4 * (btn_h + btn_gap), btn_w, btn_h);
  let space_btn_rect = new Rect(0, 0, 0, 0);
  let reset_btn_rect = new Rect(0, 0, 0, 0);
  // Mouse position in logical canvas coordinates
  let mouseLogical = { x: -1, y: -1 };

  function eventToLogical(evt) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width;
    const sy = canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * sx,
      y: (evt.clientY - rect.top) * sy
    };
  }

  canvas.addEventListener("mousemove", (e) => {
    mouseLogical = eventToLogical(e);
  });

  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    const m = eventToLogical(e);

    if (toggle_eat_rect.collidepoint(m.x, m.y)) {
      const newSetting = !state.eat_before_reproduce;
      state = reset({
        eat_before_reproduce: newSetting,
        hungry_foxes_die: state.hungry_foxes_die,
        overpop_control: state.overpop_control,
        rabbit_rescue_births: state.rabbit_rescue_births
      });
    } else if (toggle_hungry_rect.collidepoint(m.x, m.y)) {
      state.hungry_foxes_die = !state.hungry_foxes_die;
    } else if (toggle_overpop_rect.collidepoint(m.x, m.y)) {
      state.overpop_control = !state.overpop_control;
    } else if (toggle_rescue_rect.collidepoint(m.x, m.y)) {
      state.rabbit_rescue_births = !state.rabbit_rescue_births;
    } else if (toggle_auto_rect.collidepoint(m.x, m.y)) {
	  state.autoplay = !state.autoplay;
	  state.autoplay_accum = 0.0;

	} else if (space_btn_rect.collidepoint(m.x, m.y)) {
	  advanceOneStep(state);

	} else if (reset_btn_rect.collidepoint(m.x, m.y)) {
	  state = reset({
		eat_before_reproduce: state.eat_before_reproduce,
		hungry_foxes_die: state.hungry_foxes_die,
		overpop_control: state.overpop_control,
		rabbit_rescue_births: state.rabbit_rescue_births
	  });
	}
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") {
      state = reset({
        eat_before_reproduce: state.eat_before_reproduce,
        hungry_foxes_die: state.hungry_foxes_die,
        overpop_control: state.overpop_control,
        rabbit_rescue_births: state.rabbit_rescue_births
      });
      e.preventDefault();
    } else if (e.key === " " || e.code === "Space") {
      advanceOneStep(state);
      e.preventDefault();
    }
  });

  // ----------------------------------------------------
  // Frame loop
  // ----------------------------------------------------
  let lastTime = performance.now();

  function frame(now) {
    let dt = (now - lastTime) / 1000.0;
    if (dt > 0.25) dt = 0.25; // clamp big tab-switch dt's
    lastTime = now;

    // Cap to ~60 fps via the natural rAF cadence
    updateThrowAnimation(state, dt);

    if (state.autoplay && !state.game_over && !state.animating_throw) {
      state.autoplay_accum += dt;
      const stepTime = 1.0 / Math.max(0.1, AUTO_STEPS_PER_SEC);

      let stepsDone = 0;
      const maxStepsThisFrame = 5;
      while (state.autoplay_accum >= stepTime && stepsDone < maxStepsThisFrame) {
        state.autoplay_accum -= stepTime;
        advanceOneStep(state);
        stepsDone += 1;
      }
    }

    draw(ctx, state, icons,
	 { toggle_eat_rect, toggle_hungry_rect, toggle_overpop_rect, toggle_rescue_rect },
	 (rects) => {
	   toggle_auto_rect = rects.autoRect;
	   space_btn_rect = rects.spaceRect;
	   reset_btn_rect = rects.resetRect;
	 });

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  function draw(ctx, state, icons, btns, setAutoRect) {
    // Background
    ctx.fillStyle = BACKGROUND;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Board frame
    fillRect(ctx, BOARD_FRAME_X, BOARD_FRAME_Y,
             BOARD_W + 2 * BOARD_BORDER, BOARD_W + 2 * BOARD_BORDER, WOOD, 10);
    strokeRect(ctx, BOARD_FRAME_X, BOARD_FRAME_Y,
               BOARD_W + 2 * BOARD_BORDER, BOARD_W + 2 * BOARD_BORDER, WOOD_DARK, 3, 10);

    // Board tiles
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const t = BOARD_TILES[y][x];
        const color = t === 0 ? WHITE : t === 1 ? GREY : BLACK;
        ctx.fillStyle = color;
        ctx.fillRect(BOARD_X0 + x * CELL_SIZE, BOARD_Y0 + y * CELL_SIZE,
                     CELL_SIZE, CELL_SIZE);
      }
    }

    // Macro grid lines
    for (let i = 0; i <= GRID_SIZE; i += MACRO_SIZE) {
      drawLine(ctx,
               BOARD_X0 + i * CELL_SIZE, BOARD_Y0,
               BOARD_X0 + i * CELL_SIZE, BOARD_Y0 + BOARD_W,
               GRID_LINE, 4);
      drawLine(ctx,
               BOARD_X0, BOARD_Y0 + i * CELL_SIZE,
               BOARD_X0 + BOARD_W, BOARD_Y0 + i * CELL_SIZE,
               GRID_LINE, 4);
    }

    drawPredationLinks(ctx, state);
    drawCounters(ctx, state, icons);

    // Right-side panel frame
    const px = PANEL_X - PANEL_FRAME_PAD;
    const py = PANEL_Y - PANEL_FRAME_PAD;
    const pw = PANEL_W + 2 * PANEL_FRAME_PAD;
    const ph = (CONTENT_H + EXTRA_UI_H) + 2 * PANEL_FRAME_PAD;

    fillRect(ctx, px, py, pw, ph, PANEL_WOOD, PANEL_CORNER_R);
    fillRect(ctx,
             px + PANEL_BORDER_W, py + PANEL_BORDER_W,
             pw - 2 * PANEL_BORDER_W, ph - 2 * PANEL_BORDER_W,
             PANEL_BG, Math.max(0, PANEL_CORNER_R - PANEL_BORDER_W));
    strokeRect(ctx, px, py, pw, ph, PANEL_WOOD_DARK, PANEL_BORDER_W, PANEL_CORNER_R);

    // Graph titles + graphs
    const title1 = "Population dynamics across throws";
    const title1W = measureTextWidth(ctx, title1, FONT);
    drawText(ctx, title1,
             GRAPH_X + (GRAPH_W - title1W) / 2,
             (GRAPH_Y - TITLE_H) + 6,
             "rgb(0,0,0)", FONT, "top");

    drawGraph(ctx, state.throw_hist, state.rab_hist, state.fox_hist,
              GRAPH_X, GRAPH_Y, GRAPH_W, GRAPH_H);

    const title2 = "Fox-Rabbit phase trajectories";
    const title2W = measureTextWidth(ctx, title2, FONT);
    drawText(ctx, title2,
             GRAPH2_X + (GRAPH2_W - title2W) / 2,
             (GRAPH2_Y - TITLE_H) + 6,
             "rgb(0,0,0)", FONT, "top");

    drawPhaseGraph(ctx, state.rab_hist, state.fox_hist);

    // Status box (under the board)
    const lines = phaseLabel(state);
    const line_h = FONT_LINE_HEIGHT + 4;
    const box_w = BOARD_W + 2 * BOARD_BORDER;
    const box_h = (STATE_BOX_MAX_LINES * line_h) + 2 * STATE_BOX_PAD;

    const stateBoxRect = new Rect(STATE_TEXT_X, STATE_TEXT_Y, box_w, box_h);

    // Autoplay button repositioned under the status box
    const AUTO_UNDER_STATUS_GAP = 10;
    const MOBILE_BUTTON_GAP = 20;
	const SMALL_BTN_W = 90;

	// Move autoplay further left
	const autoRect = new Rect(
	  STATE_TEXT_X + Math.floor((box_w - auto_btn_w) / 2) - 110,
	  stateBoxRect.bottom + AUTO_UNDER_STATUS_GAP,
	  auto_btn_w,
	  btn_h
	);

	// Small mobile control buttons
	const spaceRect = new Rect(
	  autoRect.x + autoRect.w + MOBILE_BUTTON_GAP,
	  autoRect.y,
	  SMALL_BTN_W,
	  btn_h
	);

	const resetRect = new Rect(
	  spaceRect.x + SMALL_BTN_W + MOBILE_BUTTON_GAP,
	  autoRect.y,
	  SMALL_BTN_W,
	  btn_h
	);
    setAutoRect({
	  autoRect,
	  spaceRect,
	  resetRect
	});

    fillRect(ctx, stateBoxRect.x, stateBoxRect.y, stateBoxRect.w, stateBoxRect.h,
             STATE_BOX_BG, STATE_BOX_RADIUS);
    strokeRect(ctx, stateBoxRect.x, stateBoxRect.y, stateBoxRect.w, stateBoxRect.h,
               STATE_BOX_BORDER_COL, 1, STATE_BOX_RADIUS);

    const linesToDraw = lines.slice(0, STATE_BOX_MAX_LINES);
    for (let i = 0; i < linesToDraw.length; i++) {
      drawText(ctx, linesToDraw[i],
               STATE_TEXT_X + STATE_BOX_PAD,
               STATE_TEXT_Y + STATE_BOX_PAD + i * line_h,
               "rgb(0,0,0)", FONT, "top");
    }

    // Buttons under the graphs
    drawButton(ctx, btns.toggle_eat_rect,
               "Foxes eat before rabbits reproduce: " + (state.eat_before_reproduce ? "ON" : "OFF"),
               mouseLogical);
    drawButton(ctx, btns.toggle_hungry_rect,
               "Foxes die if they don't eat a rabbit: " + (state.hungry_foxes_die ? "ON" : "OFF"),
               mouseLogical);
    drawButton(ctx, btns.toggle_overpop_rect,
               "Foxes and rabbits die from overpopulation: " + (state.overpop_control ? "ON" : "OFF"),
               mouseLogical);
    drawButton(ctx, btns.toggle_rescue_rect,
               "Rabbits near extinction have more babies: " + (state.rabbit_rescue_births ? "ON" : "OFF"),
               mouseLogical);
    drawButton(ctx, autoRect,
           "Autoplay: " + (state.autoplay ? "ON" : "OFF"),
           mouseLogical);

	drawButton(ctx, spaceRect, "SPACE", mouseLogical);
	drawButton(ctx, resetRect, "R", mouseLogical);

    // Population legend (top-left of graph 1)
    const pad = 10;
    const line_len = 44;
    const row_h = 22;

    const box_x = GRAPH_X + 10;
    const box_y = GRAPH_Y + 10;

    const y1 = box_y + 6;
    const x1 = box_x + pad;
    drawDashedPolyline(ctx, [[x1, y1], [x1 + line_len, y1]], AXIS_COL, 2, 8, 6);
    drawText(ctx, "Foxes (" + state.foxes_display_n + ")",
             x1 + line_len + 8, y1 - 10, AXIS_COL, FONT, "top");

    const y2 = y1 + row_h;
    drawDottedPolyline(ctx, [[x1, y2], [x1 + line_len, y2]], AXIS_COL, 2, 8);
    drawText(ctx, "Rabbits (" + state.rabbits_display_n + ")",
             x1 + line_len + 8, y2 - 10, AXIS_COL, FONT, "top");
  }
}

main();
</script>
</body>
</html>
